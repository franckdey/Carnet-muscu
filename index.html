<style>
/* Layout : appli une colonne, onglets en bas façon mobile, cartes réservées aux exercices */

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --ok:#5fd08a; --ok-soft:#173523; --danger:#ff8a7a; --danger-soft:#3d1e1b; color-scheme:dark}}

  --ok:#5fd08a; --ok-soft:#173523; --danger:#ff8a7a; --danger-soft:#3d1e1b; color-scheme:dark}

/* historique */

/* onglets et minuteur */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs a{flex:1;max-width:160px;text-align:center;padding:12px 4px 14px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem;border-top:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:10px;align-items:center;z-index:6;box-shadow:0 6px 20px rgb(0 0 0 / .25)}
.timer b{font-family:var(--f-display);font-size:1.4rem;min-width:56px}
.timer button{background:var(--bg);color:var(--ink);padding:6px 10px;font-weight:600;font-size:.85rem;border-radius:999px}
.timer.chrono{background:var(--accent);color:var(--accent-ink)}
.timer .label{white-space:nowrap}
.chrono-btn{font-size:1rem}
.chrono-btn.on{background:var(--accent);color:var(--accent-ink)}
.timer.over b{color:var(--plate-15)}
.note{font-size:.84rem;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:8px 12px}
@media (max-width:420px){.records{grid-template-columns:1fr 1fr}.sets{grid-template-columns:22px 1fr 1fr 38px 42px 26px;gap:6px}.copy{width:38px}.sets.cardio{grid-template-columns:22px 1fr 1fr 1fr 42px 26px}}
@media (prefers-reduced-motion:no-preference){.ex,.h-item{transition:border-color .15s}}
</style>

<script>
const LIB = [
  ["Pecs","Développé couché machine","Chest Press"],["Pecs","Écarté machine","Pectoral Fly"],["Pecs","Développé couché barre","Bench Press"],
  ["Pecs","Développé incliné haltères","Incline Dumbbell Press"],["Pecs","Écarté poulie vis-à-vis","Cable Crossover"],["Pecs","Dips","Dips"],
  ["Dos","Tirage vertical","Lat Pulldown"],["Dos","Tirage horizontal","Low Row"],["Dos","Rowing machine","Seated Row"],["Dos","Tractions assistées","Assisted Pull-up"],
  ["Dos","Tractions","Pull-up"],["Dos","Rowing haltère","Dumbbell Row"],["Dos","Lombaires","Lower Back"],["Dos","Soulevé de terre","Deadlift"],
  ["Épaules","Développé épaules machine","Shoulder Press"],["Épaules","Développé militaire","Military Press"],["Épaules","Élévations latérales","Lateral Raise"],
  ["Épaules","Oiseau machine","Rear Delt"],["Épaules","Face pull","Face Pull"],
  ["Jambes","Presse à cuisses","Leg Press"],["Jambes","Extension des jambes","Leg Extension"],["Jambes","Leg curl assis","Seated Leg Curl"],
  ["Jambes","Leg curl allongé","Lying Leg Curl"],["Jambes","Abducteurs","Abductor"],["Jambes","Adducteurs","Adductor"],["Jambes","Squat","Squat"],
  ["Jambes","Squat guidé","Smith Machine Squat"],["Jambes","Fentes","Lunges"],["Jambes","Hip thrust","Hip Thrust"],["Jambes","Fessiers machine","Glute"],["Jambes","Mollets","Calf Raise"],
  ["Bras","Curl biceps machine","Biceps Curl"],["Bras","Curl haltères","Dumbbell Curl"],["Bras","Curl marteau","Hammer Curl"],
  ["Bras","Extension triceps machine","Triceps Extension"],["Bras","Triceps poulie","Triceps Pushdown"],["Bras","Barre au front","Skull Crusher"],
  ["Abdos","Crunch machine","Abdominal Crunch"],["Abdos","Rotation du buste","Rotary Torso"],["Abdos","Relevés de jambes","Leg Raise"],["Abdos","Gainage","Plank"],
  ["Cardio","Air bike","Air Bike"],["Cardio","Vélo droit","Upright Bike"],["Cardio","Vélo semi-allongé","Recumbent Bike"],["Cardio","Vélo de biking","Indoor Cycle"],
  ["Cardio","Tapis de course","Treadmill"],["Cardio","Escalier","Stair Climber"],
  ["Cardio","Elliptique","Cross Trainer"],["Cardio","Rameur","Rower"]
].map(([groupe,fr,en])=>({groupe,fr,en}));
const GROUPES = [...new Set(LIB.map(e=>e.groupe))];
const norm = t => String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const byName = n => LIB.find(e => norm(e.fr)===norm(n) || norm(e.en)===norm(n));
const key = n => byName(n)?.en || n;           // nom de référence : l'anglais
const subOf = n => { const e = byName(n); return e && e.en!==e.fr ? e.fr : ""; };
const REST = 60;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtKg = n => (Math.round(n*10)/10).toLocaleString("fr-FR");
const fmtDate = t => new Date(t).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = t => new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const newId = () => "s_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);


/* ---------- stockage : base privée par personne, sinon cet appareil ---------- */
let sessions = {};          // id -> séance
let mode = "loading";       // "db" | "local" | "loading"
let col = null;
const dirty = new Set();    // séances modifiées localement, pas encore enregistrées
const timers = {};
const LS_KEY = "carnet-muscu-v1";

function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch{ return {}; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(sessions)); }catch{} }

function save(id, immediate){
  dirty.add(id);
  clearTimeout(timers[id]);
  const run = async () => {
    const doc = sessions[id];
    if (mode === "db" && col){
      try{
        if (doc) await col.doc(id).set(JSON.parse(JSON.stringify(doc)));
        else await col.doc(id).delete();
        setSync("Enregistré");
      }catch(e){ setSync("Échec de l’enregistrement, réessaie"); }
    } else { lsSave(); setSync("Enregistré sur le téléphone"); }
    dirty.delete(id);
  };
  if (immediate || mode !== "db") run(); else timers[id] = setTimeout(run, 600);
}
function setSync(t){ $("#sync").textContent = t; }

async function initStore(){
  const fallback = () => {
    if (mode !== "loading") return;
    mode = "local"; sessions = lsLoad();
    setSync("Enregistré sur le téléphone");
    render();
  };
  const giveUp = setTimeout(fallback, 10000);
  try{
    if (!window.claude?.use){ clearTimeout(giveUp); return fallback(); }
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid){ clearTimeout(giveUp); return fallback(); }
    col = db.collection("data/users/" + uid);
    col.onSnapshot(snap => {
      clearTimeout(giveUp);
      const next = {};
      snap.docs.forEach(d => { if (d.id.startsWith("s_")) next[d.id] = d.data(); });
      for (const id of dirty) { if (sessions[id]) next[id] = sessions[id]; else delete next[id]; }
      sessions = JSON.parse(JSON.stringify(next));
      const first = mode !== "db"; mode = "db";
      if (first || !snap.metadata.hasPendingWrites) setSync(snap.metadata.fromCache ? "Synchronisation…" : "Synchronisé");
      if (!document.activeElement || !["INPUT","TEXTAREA"].includes(document.activeElement.tagName) || first) render();
    }, () => { clearTimeout(giveUp); fallback(); });
  }catch{ clearTimeout(giveUp); fallback(); }
}

/* ---------- pictos schématiques (vue de profil ou de face) ---------- */
const hd = (x,y,r=1.8) => `M${x-r} ${y}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`;
const legsStand = (x,y) => `M${x} ${y}L${x-2} 21M${x} ${y}L${x+2} 21`;
const G = {
  chestpress: `M5 4V17M3 17H12${hd(8,5)}M8 7V15M8 9.5H15M15 7.5V11.5M8 15H12V20`,
  fly: `${hd(12,4)}M12 6V14M12 8.5C9 8.5 6 9.5 5 12M12 8.5C15 8.5 18 9.5 19 12M4 10.5V14M20 10.5V14${legsStand(12,14)}`,
  bench: `M3 16H18M6 16V20M16 16V20${hd(4.5,13.2)}M6.5 14H15L17 20M9 14V8M5 8H13M5 6.5V9.5M13 6.5V9.5`,
  incline: `M4 19L12 11M12 11V20${hd(5,8)}M6 10L11 14M11 14L15 14L16 20M8 11.5L11 5M7 5H15M7 3.5V6.5M15 3.5V6.5`,
  dips: `M3 12H9M15 12H21M9 12V20M15 12V20${hd(12,4.5)}M12 6.5V15M12 8L9.5 12M12 8L14.5 12M12 15L11 21`,

const GLYPH_BY_GROUP = {"Pecs":"chestpress","Dos":"row","Épaules":"shoulderpress","Jambes":"squat","Bras":"curl","Abdos":"crunch","Cardio":"treadmill"};
function icon(n, cls="ico"){
  const e = byName(n);
  const g = G[(e && (GLYPH_BY_EN[e.en] || GLYPH_BY_GROUP[e.groupe])) || "deadlift"];
  return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${g}"/></svg>`;

/* ---------- calculs ---------- */
const list = () => Object.entries(sessions).map(([id,s])=>({id,...s}));
const current = () => list().find(s => !s.terminee && !s.prevue);
const plans = () => list().filter(s => s.prevue).sort((a,b)=>((a.ordre??Infinity)-(b.ordre??Infinity)) || (b.debut-a.debut));
const finished = () => list().filter(s => s.terminee).sort((a,b)=>b.debut-a.debut);
const isCardio = n => byName(n)?.groupe === "Cardio";
const TIMED = new Set(["Plank"]);
const isTimed = n => TIMED.has(key(n));
const fmtSet = (n,x) => isTimed(n) ? `${x.reps}×${x.kg||0} s` : isCardio(n) ? `${x.reps} min${x.kg!==""&&x.kg!=null?` · ${fmtKg(+x.kg)} km`:""}${x.kcal?` · ${x.kcal} kcal`:""}` : `${x.reps}×${fmtKg(+x.kg||0)}`;
const exKm = e => (e.km!==undefined && e.km!=="") ? (+e.km||0) : (e.series||[]).reduce((u,x)=>u+(+x.kg||0),0);
const METRES = new Set(["Rower"]);
const inM = n => METRES.has(key(n));
const fmtDist = (n, km) => inM(n) ? `${Math.round(km*1000).toLocaleString("fr-FR")} m` : `${fmtKg(km)} km`;
const cardioTot = e => `${exKm(e)?` · ${fmtDist(e.nom, exKm(e))}`:""}${exKcal(e)?` · ${exKcal(e)} kcal`:""}`;
const exKcal = e => (e.kcal!==undefined && e.kcal!=="") ? (+e.kcal||0) : (e.series||[]).reduce((u,x)=>u+(+x.kcal||0),0);
const kcal = s => (s.exercices||[]).reduce((t,e)=>t+(isCardio(e.nom)?exKcal(e):0),0);
const volume = s => (s.exercices||[]).reduce((t,e)=>t+(isCardio(e.nom)||isTimed(e.nom)?0:(e.series||[]).reduce((u,x)=>u+(+x.reps||0)*(+x.kg||0),0)),0);
const nbSeries = s => (s.exercices||[]).reduce((t,e)=>t+(e.series||[]).filter(x=>x.reps).length,0);
function lastFor(name, excludeId){
  const k = key(name), same = e => key(e.nom)===k;
  const s = finished().find(s => s.id!==excludeId && (s.exercices||[]).some(same));
  if (!s) return null; const fe = s.exercices.find(same);
  return { date:s.debut, series:fe.series.filter(x=>x.reps), kcal: isCardio(name) ? exKcal(fe) : 0, km: isCardio(name) ? exKm(fe) : 0, tot: isCardio(name) ? cardioTot(fe) : "" };
}
function sessName(s){
  if (s.nom) return s.nom;
  const g = [...new Set((s.exercices||[]).map(e=>byName(e.nom)?.groupe).filter(Boolean))];
  return g.length ? g.join(" · ") : "Séance";
}
function weekStart(){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d.getTime(); }
function daysThisWeek(n){
  const k = key(n), w0 = weekStart(), days = new Set();
  list().forEach(s => { if (s.debut >= w0 && s.debut < w0 + 7*864e5 && (s.exercices||[]).some(e => key(e.nom)===k && (e.series||[]).some(x=>x.reps))) days.add((new Date(s.debut).getDay()+6)%7); });
  return days;
}
const weekRow = n => { const d = daysThisWeek(n), today = (new Date().getDay()+6)%7;
  return `<span class="week" aria-label="Jours pratiqués cette semaine : ${d.size}">${"LMMJVSD".split("").map((l,i)=>`<span class="${d.has(i)?"on":""}${i===today?" today":""}">${l}</span>`).join("")}</span>`; };
const chipEx = e => `<button type="button" class="mach" data-act="addex" data-nom="${esc(e.en)}">${icon(e.en,"ico-m")}<span class="mach-txt"><span class="mach-en">${esc(e.en)}</span>${e.en!==e.fr?`<span class="mach-fr">${esc(e.fr)}</span>`:""}${weekRow(e.en)}</span></button>`;
function suggestions(q){
  q = norm(q);
  if (!q) return "";
  const hits = LIB.filter(e => norm(e.fr).includes(q) || norm(e.en).includes(q)).slice(0,8);
  return hits.length ? `<div class="mgrid">${hits.map(chipEx).join("")}</div>` : `<p class="muted" style="margin:0;font-size:.88rem">Aucune machine connue, « Ajouter » crée l’exercice tel quel.</p>`;
}
const e1rm = (kg,reps) => reps>0 ? kg*(1+reps/30) : 0;
const plateColor = kg => kg>=100?"var(--plate-25)":kg>=60?"var(--plate-20)":kg>=30?"var(--plate-15)":"var(--plate-10)";

/* ---------- vues ---------- */
const tab = () => (["seance","prevues","historique","progres"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "seance");
let openHist = null, confirmDel = null, progEx = null, planEdit = null;
const openPlans = new Set((()=>{ try{ return JSON.parse(localStorage.getItem("carnet-plans-ouverts")||"[]"); }catch{ return []; } })());
const saveOpenPlans = () => { try{ localStorage.setItem("carnet-plans-ouverts", JSON.stringify([...openPlans])); }catch{} };

function render(){
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.tab===tab()) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const v = $("#view");
  if (mode === "loading"){ v.innerHTML = `<p class="muted">Chargement de tes séances…</p>`; return; }
  const t = tab();
  v.innerHTML = t==="seance" ? viewSeance() : t==="prevues" ? viewPlans() : t==="historique" ? viewHist() : viewProg();
}

function viewSeance(){
  const s = current();
  const note = "";
  if (!s){
    const prev = finished()[0];
    return `<div class="stack">${note}
      <div class="empty">
        <h2>Prêt pour la salle ?</h2>
        <p>Lance ta séance puis ajoute tes exercices au fur et à mesure. Pour chacun, l’appli te rappelle ce que tu as fait la dernière fois, pour viser une rep ou un kilo de plus.</p>
        <button class="btn" data-act="start">Commencer une séance</button>
        ${prev ? `<button class="btn ghost" data-act="repeat">Refaire ta dernière séance (${esc(sessName(prev))}, ${fmtShort(prev.debut)})</button>` : ""}
      </div>
      ${plans().filter(p=>(p.exercices||[]).length).length ? `<div class="stack" style="gap:8px"><span class="label">Démarrer une séance prévue</span>${plans().filter(p=>(p.exercices||[]).length).map(p=>`<button class="btn ghost" style="text-align:left" data-act="planStart" data-id="${p.id}">${esc(sessName(p))} <span class="muted" style="font-weight:500">· ${p.exercices.length} machine${p.exercices.length>1?"s":""}</span></button>`).join("")}</div>` : ""}
    </div>`;
  }
  const exs = s.exercices||[];
  return `<div class="stack">${note}
    <div class="sess-head">
      <div><span class="label">${esc(fmtDate(s.debut))}</span><h2>${esc(sessName(s))}</h2></div>
      <div class="meta">
        <div class="stat"><span class="label">Séries</span><b class="num">${nbSeries(s)}</b></div>
        <div class="stat"><span class="label">Volume</span><b class="num">${fmtKg(volume(s))} kg</b></div>
        ${(s.exercices||[]).some(e=>isCardio(e.nom)) ? `<div class="stat"><span class="label">Calories</span><b class="num">${kcal(s)} kcal</b></div>` : ""}
      </div>
    </div>
    ${exs.map((e,i)=>exCard(s,e,i)).join("")}
    ${addBlock(exs.length, "dans cette séance")}
    <div class="row">
      <button class="btn block" data-act="finish">Terminer la séance</button>
      ${confirmDel===s.id
        ? `<button class="btn danger block" data-act="del" data-id="${s.id}">Confirmer l’abandon</button>`
        : `<button class="btn ghost block" data-act="askdel" data-id="${s.id}">Abandonner</button>`}
    </div></div>`;
}

let libOpen = null;
document.addEventListener("toggle", e => { if (e.target.classList && e.target.classList.contains("lib")) libOpen = e.target.open; }, true);
function addBlock(n, where, defOpen = n===0){
  return `<span class="label">${n ? `Ajouter une autre machine (${n} ${where})` : "Ajouter une machine"}</span>
    <form class="add-ex" data-form="addex">
      <input id="newEx" placeholder="Chercher une machine (ex. Leg Press, presse)" autocomplete="off" aria-label="Nom de l’exercice, en français ou en anglais">
      <button class="btn" type="submit">Ajouter</button>
    </form>
    <div id="sugg"></div>
    <details class="lib" ${(libOpen!==null ? libOpen : defOpen)?"open":""}><summary>Toutes les machines par groupe</summary><div class="stack" style="margin-top:12px">${GROUPES.map(g=>`<div class="stack" style="gap:6px"><span class="label">${esc(g)}</span><div class="mgrid">${LIB.filter(e=>e.groupe===g).map(chipEx).join("")}</div></div>`).join("")}</div></details>`;
}

function viewPlans(){
  const ed = planEdit && sessions[planEdit] ? {id:planEdit, ...sessions[planEdit]} : null;
  if (ed){
    const exs = ed.exercices||[];
    return `<div class="stack">
      <div class="sess-head"><div><span class="label">Séance prévue</span><h2 id="planTitle">${esc(sessName(ed))}</h2></div></div>
      <div class="stack" style="gap:6px"><label class="label" for="planName">Nom (facultatif)</label>
        <input id="planName" value="${esc(ed.nom)}" placeholder="ex. Haut du corps, Jambes du lundi" autocomplete="off"></div>
      ${exs.length ? `<div class="plan-list">${exs.map((e,i)=>`<div class="plan-ex">
        ${icon(e.nom,"ico-m")}<span class="mach-txt"><span class="mach-en">${esc(key(e.nom))}</span>${subOf(e.nom)?`<span class="mach-fr">${esc(subOf(e.nom))}</span>`:""}</span>
        <button class="x" data-act="planUp" data-i="${i}" aria-label="Monter ${esc(key(e.nom))}" ${i===0?"disabled":""}>▲</button>

        <button class="x" data-act="planRm" data-i="${i}" aria-label="Retirer ${esc(key(e.nom))}">✕</button></div>`).join("")}</div>` : `<p class="muted" style="margin:0">Ajoute les machines de cette séance, dans l’ordre où tu veux les faire. Pas besoin de poids ni de reps.</p>`}
      ${addBlock(exs.length, "prévue" + (exs.length>1?"s":""), true)}

    </div>`;
  }
  const ps = plans();
  return `<div class="stack">
    <div class="sess-head"><h2>Séances prévues</h2><button class="btn" data-act="planNew">+ Préparer une séance</button></div>
    ${ps.length ? "" : `<div class="empty"><p>Prépare tes séances à l’avance avec juste la liste des machines. À la salle, tu la démarres en un geste et il ne reste qu’à remplir reps et poids.</p></div>`}
    ${ps.length>1 ? `<div class="row" style="justify-content:flex-end;gap:6px"><button class="btn ghost small" data-act="planAll" data-open="1">Tout déplier</button><button class="btn ghost small" data-act="planAll" data-open="0">Tout replier</button></div>` : ""}
    <div class="hist">${ps.map((p,idx)=>{ const exs = p.exercices||[], op = openPlans.has(p.id); return `<div class="h-item"><div class="h-body" style="padding-top:14px">
      <div class="h-sum" style="padding:0"><button class="plan-tog" data-act="planToggle" data-id="${p.id}" aria-expanded="${op}"><span class="chev">${op?"▾":"▸"}</span><span><span class="h-date">${esc(sessName(p))}</span><br><span class="muted" style="font-size:.88rem">${exs.length} machine${exs.length>1?"s":""}</span></span></button><span class="row" style="gap:2px;flex-wrap:nowrap">
        <button class="x" data-act="planMove" data-dir="-1" data-id="${p.id}" aria-label="Monter ${esc(sessName(p))}" ${idx===0?"disabled":""}>▲</button>
        <button class="x" data-act="planMove" data-dir="1" data-id="${p.id}" aria-label="Descendre ${esc(sessName(p))}" ${idx===ps.length-1?"disabled":""}>▼</button></span></div>
      ${op ? exs.map(e=>`<div class="h-ex"><span class="h-name">${icon(e.nom,"ico-s")}<span>${esc(key(e.nom))}${subOf(e.nom)?` <span class="en">${esc(subOf(e.nom))}</span>`:""}</span></span></div>`).join("") : ""}
      <div class="row" style="justify-content:flex-end;margin-top:6px">
        ${current() ? `<span class="muted" style="font-size:.85rem;margin-right:auto">Une séance est déjà en cours.</span>` : `<button class="btn small" style="margin-right:auto" data-act="planStart" data-id="${p.id}" ${exs.length?"":"disabled"}>Démarrer</button>`}
        ${op ? `<button class="btn ghost small" data-act="planOpen" data-id="${p.id}">Modifier</button>
        ${confirmDel===p.id ? `<button class="btn danger small" data-act="del" data-id="${p.id}">Confirmer la suppression</button>` : `<button class="btn ghost small" data-act="askdel" data-id="${p.id}">Supprimer</button>`}` : ""}
      </div></div></div>`; }).join("")}</div>
  </div>`;
}

function exCard(s,e,i){
  const last = lastFor(e.nom, s.id), c = isCardio(e.nom), t = isTimed(e.nom);
  const lastTxt = last ? `Dernière fois (${fmtShort(last.date)}) : ${last.series.map(x=>fmtSet(e.nom,c?{...x,kg:"",kcal:""}:x)).join(" · ")}${last.tot}` : "Première fois sur cet exercice";
  return `<section class="ex">
    <div class="ex-top"><span class="ex-title">${icon(e.nom)}<span class="ex-name">${esc(key(e.nom))}${subOf(e.nom)?`<span class="en-sub">${esc(subOf(e.nom))}</span>`:""}</span></span><button class="x" title="Retirer l’exercice" aria-label="Retirer ${esc(e.nom)}" data-act="rmex" data-i="${i}">✕</button></div>
    <div class="last">${esc(lastTxt)}</div>
    <div class="sets">
      <span class="h">#</span><span class="h">${c?"Minutes":"Reps"}</span><span class="h">${c?"":t?"Sec":"Kg"}</span><span></span><span class="h">Fait</span><span></span>
      ${(e.series||[]).map((x,j)=>{ const p = last?.series[j];
        return `<span class="idx">${j+1}</span>
        <input id="r-${i}-${j}" inputmode="numeric" value="${esc(x.reps)}" placeholder="${p?esc(p.reps):""}" data-f="reps" data-i="${i}" data-j="${j}" aria-label="${c?"Minutes":"Répétitions"} série ${j+1}">
        ${c ? `<span></span>` : `<input id="k-${i}-${j}" inputmode="decimal" value="${esc(x.kg)}" placeholder="${p?esc(p.kg):""}" data-f="kg" data-i="${i}" data-j="${j}" aria-label="${t?"Secondes":"Kilos"} série ${j+1}">`}
        ${(c||t) ? `<button class="copy chrono-btn${chrono&&chrono.i===i&&chrono.j===j?" on":""}" data-act="chrono" data-i="${i}" data-j="${j}" title="Chronométrer la série ${j+1}" aria-label="Chronométrer la série ${j+1}">⏱</button>` : `<button class="copy" ${j===0?"disabled":""} data-act="copyset" data-i="${i}" data-j="${j}" title="Recopier la série ${j}" aria-label="Recopier la série ${j} dans la série ${j+1}">↓</button>`}
        <button class="done" aria-pressed="${!!x.fait}" data-act="done" data-i="${i}" data-j="${j}" aria-label="Série ${j+1} faite">✓</button>
        <button class="x" data-act="rmset" data-i="${i}" data-j="${j}" aria-label="Supprimer la série ${j+1}">✕</button>`; }).join("")}
    </div>
    <button class="btn ghost small" data-act="addset" data-i="${i}">+ Série</button>
    ${c ? `<div class="ex-kcal"><label for="km-${i}">Distance de l’activité</label>${(()=>{ const m = inM(e.nom), v = e.km!==undefined&&e.km!==""?+e.km:exKm(e), conv = k => m ? Math.round(k*1000) : k;
      return `<input id="km-${i}" inputmode="${m?"numeric":"decimal"}" data-efield="km" data-unit="${m?"m":"km"}" data-i="${i}" value="${v?esc(conv(v)):""}" placeholder="${last&&last.km?esc(conv(last.km)):(m?"m":"km")}"><span>${m?"m":"km"}</span>`; })()}</div>
    <div class="ex-kcal"><label for="kcal-${i}">Calories de l’activité</label><input id="kcal-${i}" inputmode="numeric" data-efield="kcal" data-i="${i}" value="${esc(e.kcal!==undefined&&e.kcal!==""?e.kcal:(exKcal(e)||""))}" placeholder="${last&&last.kcal?esc(last.kcal):"kcal"}"><span>kcal</span></div>` : ""}
    ${c ? `<textarea id="note-${i}" class="ex-note" data-note="${i}" rows="2" placeholder="Commentaire (programme, niveau, ressenti…)" aria-label="Commentaire pour ${esc(key(e.nom))}">${esc(e.note||"")}</textarea>` : ""}
  </section>`;
}

function viewHist(){
  const f = finished();
  if (!f.length) return `<div class="empty"><h2>Aucune séance terminée</h2><p>Quand tu termines une séance, elle apparaît ici avec ses exercices, ses séries et le volume soulevé.</p><a class="btn" style="text-align:center;text-decoration:none" href="#seance">Commencer une séance</a></div>${backupBlock()}`;
  const total = f.length, mois = f.filter(s=>Date.now()-s.debut < 30*864e5).length;
  return `<div class="stack">
    <div class="sess-head"><h2>${total} séance${total>1?"s":""}</h2><span class="muted">${mois} ces 30 derniers jours</span></div>
    <div class="hist">${f.map(s=>{
      const dur = s.fin ? Math.round((s.fin-s.debut)/60000) : null;
      const open = openHist===s.id;
      return `<div class="h-item">
        <button class="h-sum" data-act="toggle" data-id="${s.id}" aria-expanded="${open}">
          <span><span class="h-date">${esc(sessName(s))}</span><br><span class="muted" style="font-size:.88rem">${esc(fmtDate(s.debut))}${dur?` · ${dur} min`:""}</span></span>
          <span class="num" style="text-align:right"><b>${fmtKg(volume(s))} kg</b><br><span class="muted" style="font-size:.85rem">${nbSeries(s)} séries${kcal(s)?` · ${kcal(s)} kcal`:""}</span></span>
        </button>
        ${open ? `<div class="h-body">
          ${(s.exercices||[]).map(e=>`<div class="h-ex"><span class="h-name">${icon(e.nom,"ico-s")}<span>${esc(key(e.nom))}${subOf(e.nom)?` <span class="en">${esc(subOf(e.nom))}</span>`:""}</span></span><span class="num">${(e.series||[]).filter(x=>x.reps).map(x=>fmtSet(e.nom,isCardio(e.nom)?{...x,kg:"",kcal:""}:x)).join(" · ")||"—"}${isCardio(e.nom)?cardioTot(e):""}</span></div>${e.note?`<p class="h-note">${esc(e.note)}</p>`:""}`).join("")}
          <div class="row" style="justify-content:flex-end;margin-top:6px">
            ${current() ? `<span class="muted" style="font-size:.85rem;margin-right:auto">Termine la séance en cours pour reprendre celle-ci.</span>` : `<button class="btn small" data-act="repeat" data-id="${s.id}">Refaire cette séance</button><button class="btn ghost small" style="margin-right:auto" data-act="resume" data-id="${s.id}">Reprendre</button>`}

function backupBlock(){
  return `<div class="empty" style="margin-top:14px"><h2>Sauvegarde</h2>
    <p>Tes séances sont enregistrées sur ce téléphone. Exporte une sauvegarde de temps en temps (Drive, mail…) pour les retrouver si tu changes de téléphone ou désinstalles l’appli.</p>
    <div class="row"><button class="btn" data-act="export">Exporter mes séances</button><button class="btn ghost" data-act="import">Importer une sauvegarde</button></div></div>`;
}
function exportData(){
  const data = JSON.stringify({app:"carnet-muscu", version:1, exportedAt:Date.now(), sessions});
  const name = "carnet-muscu-" + new Date().toISOString().slice(0,10) + ".json";
  if (window.Android && Android.saveBackup) { Android.saveBackup(name, data); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download = name; a.click();
}
function importData(text){
  try{
    const obj = JSON.parse(text), src = obj && obj.sessions;
    if (!src || typeof src !== "object") throw 0;
    let n = 0;
    for (const [id,s] of Object.entries(src)) if (id.startsWith("s_") && s && Array.isArray(s.exercices)) { sessions[id] = s; n++; }
    lsSave(); render(); setSync(n + " séance" + (n>1?"s":"") + " importée" + (n>1?"s":""));
  }catch{ setSync("Fichier de sauvegarde illisible"); }
}

function viewProg(){
  const f = finished().slice().reverse();
  const names = [...new Set(f.flatMap(s=>(s.exercices||[]).map(e=>key(e.nom))))].sort((a,b)=>a.localeCompare(b,"fr"));
  if (!names.length) return `<div class="empty"><h2>Pas encore de progrès à montrer</h2><p>Après quelques séances, tu verras ici l’évolution de ta meilleure série et tes records pour chaque exercice.</p></div>`;
  if (!names.includes(progEx)) progEx = names[0];
  if (isTimed(progEx)){
    const pts = f.map(s=>{ const e=(s.exercices||[]).find(e=>key(e.nom)===progEx); if(!e) return null;
      const ser=(e.series||[]).filter(x=>x.reps&&x.kg); if(!ser.length) return null;
      const mx = Math.max(...ser.map(x=>+x.kg||0)), tot = ser.reduce((t,x)=>t+(+x.reps||0)*(+x.kg||0),0);
      return {t:s.debut, e:mx, tot, tip:`${fmtShort(s.debut)} : ${ser.map(x=>fmtSet(progEx,x)).join(" · ")}`};
    }).filter(Boolean);
    return `<div class="stack">${progSelect(names)}
      <div class="records">
        <div class="rec"><span class="label">Durée max</span><b class="num">${Math.max(0,...pts.map(p=>p.e))} s</b></div>
        <div class="rec"><span class="label">Total max</span><b class="num">${Math.max(0,...pts.map(p=>p.tot))} s</b></div>
        <div class="rec"><span class="label">Séances</span><b class="num">${pts.length}</b></div>
      </div>
      <div class="chart">${chart(pts, "Meilleure série (s)")}</div>
    </div>`;
  }
  if (isCardio(progEx)){
    const pts = f.map(s=>{ const e=(s.exercices||[]).find(e=>key(e.nom)===progEx); if(!e) return null;
      const ser=(e.series||[]).filter(x=>x.reps); if(!ser.length) return null;
      const min = ser.reduce((t,x)=>t+(+x.reps||0),0), km = exKm(e), cal = exKcal(e);
      return {t:s.debut, min, km, cal};
    }).filter(Boolean);
    const useKm = pts.some(p=>p.km>0);
    pts.forEach(p=>{ p.e = useKm ? (inM(progEx) ? Math.round(p.km*1000) : p.km) : p.min; p.tip = `${fmtShort(p.t)} : ${p.min} min${p.km?` · ${fmtDist(progEx, p.km)}`:""}${p.cal?` · ${p.cal} kcal`:""}`; });
    return `<div class="stack">${progSelect(names)}
      <div class="records four">
        <div class="rec"><span class="label">Durée max</span><b class="num">${Math.max(0,...pts.map(p=>p.min))} min</b></div>
        <div class="rec"><span class="label">Distance max</span><b class="num">${fmtDist(progEx, Math.max(0,...pts.map(p=>p.km)))}</b></div>
        <div class="rec"><span class="label">Calories max</span><b class="num">${Math.max(0,...pts.map(p=>p.cal))} kcal</b></div>
        <div class="rec"><span class="label">Séances</span><b class="num">${pts.length}</b></div>
      </div>
      <div class="chart">${chart(pts, useKm ? (inM(progEx) ? "Distance (m)" : "Distance (km)") : "Durée (min)")}</div>
    </div>`;
  }
  const pts = f.map(s=>{ const e=(s.exercices||[]).find(e=>key(e.nom)===progEx); if(!e) return null;
    const ser=(e.series||[]).filter(x=>x.reps&&x.kg!=="");
    if(!ser.length) return null;
    const best = ser.reduce((b,x)=>e1rm(+x.kg,+x.reps)>e1rm(+b.kg,+b.reps)?x:b);
    const e1 = e1rm(+best.kg,+best.reps);
    return {t:s.debut, kg:Math.max(...ser.map(x=>+x.kg||0)), e:e1, tip:`${fmtShort(s.debut)} : ${best.reps}×${fmtKg(+best.kg)} kg (1RM ≈ ${fmtKg(e1)} kg)`};
  }).filter(Boolean);
  const maxKg = Math.max(0,...pts.map(p=>p.kg)), maxE = Math.max(0,...pts.map(p=>p.e));
  return `<div class="stack">${progSelect(names)}
    <div class="records">
      <div class="rec"><span class="label">Charge max</span><b class="num"><span class="plate" style="background:${plateColor(maxKg)}"></span>${fmtKg(maxKg)} kg</b></div>
      <div class="rec"><span class="label">1RM estimé</span><b class="num">${fmtKg(maxE)} kg</b></div>
      <div class="rec"><span class="label">Séances</span><b class="num">${pts.length}</b></div>
    </div>
    <div class="chart">${chart(pts, "1RM estimé (kg)")}</div>
    <p class="muted" style="font-size:.85rem;margin:0">Le 1RM estimé (formule d’Epley) donne la charge que tu pourrais soulever une seule fois, à partir de ta meilleure série du jour.</p>
  </div>`;
}
const progSelect = names => `<label class="label" for="progSel">Exercice</label>
    <select id="progSel">${names.map(n=>`<option value="${esc(n)}" ${n===progEx?"selected":""}>${esc(n)}${subOf(n)?` (${esc(subOf(n))})`:""}</option>`).join("")}</select>`;

function chart(pts, label){
  if (pts.length<2) return `<p class="muted" style="margin:8px">Il faut au moins deux séances avec cet exercice pour tracer une courbe.</p>`;
  const W=600,H=220,L=44,R=14,T=16,B=30;
  const vals = pts.map(p=>p.e), lo=Math.floor(Math.min(...vals)*0.9), hi=Math.max(lo+1, Math.ceil(Math.max(...vals)*1.05));
  const x = i => L + i*(W-L-R)/(pts.length-1), y = v => T + (hi-v)*(H-T-B)/((hi-lo)||1);
  const ticks = [lo, Math.round((lo+hi)/2), hi];
  const line = pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.e).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length-1).toFixed(1)},${H-B}L${L},${H-B}Z`;
  const step = Math.ceil(pts.length/6);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution : ${esc(label)}">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join("")}
    <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.e)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"><title>${esc(p.tip)}</title></circle>`).join("")}
    ${pts.map((p,i)=> i%step===0||i===pts.length-1 ? `<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtShort(p.t)}</text>`:"").join("")}
  </svg>`;
}

/* ---------- actions ---------- */
function startSession(nom = "", template){
  libOpen = null;
  const id = newId();
  sessions[id] = { nom, debut: Date.now(), terminee:false,
    exercices: (template||[]).map(e=>({nom:e.nom, series:(e.series||[]).filter(x=>x.reps).map(x=>({reps:String(x.reps??""),kg:String(x.kg??""),fait:false}))})) };
  save(id, true); render();
}
function startFromPlan(id){
  const p = sessions[id]; if (!p || current()) return;
  const nid = newId();
  sessions[nid] = { nom: p.nom||"", debut: Date.now(), terminee:false, exercices: (p.exercices||[]).map(e=>{
    const last = lastFor(e.nom, nid), n = last ? Math.max(1,last.series.length) : (isCardio(e.nom) ? 1 : 3);
    return {nom:e.nom, series:Array.from({length:n},()=>({reps:"",kg:"",fait:false}))}; }) };
  save(nid, true); location.hash = "#seance"; render();
}
function addPlanEx(nom){
  const p = sessions[planEdit]; nom = (nom||"").trim(); if (!p || !nom) return;
  p.exercices = [...(p.exercices||[]), {nom:key(nom)}];
  save(planEdit, true); render();
}
const addAny = nom => (tab()==="prevues" && planEdit && sessions[planEdit]) ? addPlanEx(nom) : addExercise(nom);
function addExercise(nom){
  const s = current(); nom = (nom||"").trim(); if(!s||!nom) return;
  nom = key(nom);
  const last = lastFor(nom, s.id);
  const n = last ? Math.max(1,last.series.length) : (isCardio(nom) ? 1 : 3);
  sessions[s.id].exercices = [...(s.exercices||[]), {nom, series:Array.from({length:n},()=>({reps:"",kg:"",fait:false}))}];
  save(s.id, true); render();
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, s = current(), i = +b.dataset.i, j = +b.dataset.j;
  if (act!=="askdel" && act!=="del") confirmDel = null;
  switch(act){
    case "start": startSession(); break;
    case "repeat": { if (current()) break; const p = b.dataset.id ? sessions[b.dataset.id] : finished()[0]; if (!p) break; startSession(p.nom, p.exercices); openHist = null; location.hash = "#seance"; break; }
    case "addex": addAny(b.dataset.nom); break;
    case "planNew": { const id = newId(); sessions[id] = {prevue:true, nom:"", debut:Date.now(), terminee:false, exercices:[], ordre: Math.min(0, ...plans().map(p=>p.ordre??0)) - 1}; planEdit = id; libOpen = null; save(id,true); render(); window.scrollTo(0,0); break; }
    case "planMove": { const ps = plans(), k = ps.findIndex(p=>p.id===b.dataset.id), t = k + +b.dataset.dir;
      if (k<0 || t<0 || t>=ps.length) break; [ps[k],ps[t]] = [ps[t],ps[k]];
      ps.forEach((p,n)=>{ if (sessions[p.id].ordre !== n){ sessions[p.id].ordre = n; save(p.id,true); } }); render(); break; }
    case "planToggle": { const id = b.dataset.id; openPlans.has(id) ? openPlans.delete(id) : openPlans.add(id); saveOpenPlans(); render(); break; }
    case "planAll": openPlans.clear(); if (b.dataset.open==="1") plans().forEach(p=>openPlans.add(p.id)); saveOpenPlans(); render(); break;
    case "planOpen": planEdit = b.dataset.id; libOpen = null; render(); window.scrollTo(0,0); break;
    case "planDone": { const p = sessions[planEdit]; if (p && !(p.exercices||[]).length && !p.nom){ delete sessions[planEdit]; save(planEdit,true); } planEdit = null; render(); window.scrollTo(0,0); break; }
    case "planStart": startFromPlan(b.dataset.id); break;
    case "planRm": sessions[planEdit].exercices.splice(i,1); save(planEdit,true); render(); break;
    case "planUp": case "planDown": { const a = sessions[planEdit].exercices, k = act==="planUp" ? i-1 : i+1; if (k<0||k>=a.length) break; [a[i],a[k]] = [a[k],a[i]]; save(planEdit,true); render(); break; }
    case "rmex": sessions[s.id].exercices.splice(i,1); save(s.id,true); render(); break;
    case "addset": { const ser = sessions[s.id].exercices[i].series; const l = ser[ser.length-1]||{};
      ser.push({reps:l.reps||"",kg:l.kg||"",fait:false}); save(s.id,true); render(); break; }
    case "copyset": { const ser = sessions[s.id].exercices[i].series;
      const prev = lastFor(sessions[s.id].exercices[i].nom, s.id)?.series[j-1] || {};
      ser[j].reps = ser[j-1].reps !== "" ? ser[j-1].reps : String(prev.reps ?? "");
      ser[j].kg = ser[j-1].kg !== "" ? ser[j-1].kg : String(prev.kg ?? "");
      save(s.id,true); render(); break; }
    case "rmset": sessions[s.id].exercices[i].series.splice(j,1); save(s.id,true); render(); break;
    case "done": { const x = sessions[s.id].exercices[i].series[j];
      { const p = lastFor(sessions[s.id].exercices[i].nom, s.id)?.series[j]; if(p){ if (x.reps==="") x.reps=String(p.reps??""); if (x.kg==="" && !isCardio(sessions[s.id].exercices[i].nom)) x.kg=String(p.kg??""); } }
      x.fait = !x.fait; save(s.id,true); render(); if (x.fait && !isCardio(sessions[s.id].exercices[i].nom)) startTimer(REST); break; }
    case "finish": { if (chrono){ clearInterval(chronoTick); chrono = null; $("#chrono").hidden = true; keepAwake(false); }
      const ss = sessions[s.id];
      ss.exercices = (ss.exercices||[]).map(e=>({...e, series:e.series.filter(x=>x.reps!=="")})).filter(e=>e.series.length);
      if (!ss.exercices.length){ delete sessions[s.id]; save(s.id,true); render(); break; }
      ss.terminee = true; ss.fin = Date.now(); save(s.id,true); stopTimer(); openHist = s.id; location.hash = "#historique"; render(); break; }
    case "chrono": if (chrono && chrono.i===i && chrono.j===j) endChrono(true); else startChrono(i,j); break;
    case "export": exportData(); break;
    case "import": $("#importFile").click(); break;
    case "askdel": confirmDel = b.dataset.id; render(); break;
    case "resume": { if (current()) break; const ss = sessions[b.dataset.id]; ss.terminee = false; delete ss.fin; save(b.dataset.id,true); openHist = null; location.hash = "#seance"; render(); break; }
    case "del": delete sessions[b.dataset.id]; save(b.dataset.id,true); confirmDel=null; render(); break;
    case "toggle": openHist = openHist===b.dataset.id ? null : b.dataset.id; confirmDel=null; render(); break;
  }
});
document.addEventListener("input", ev => {
  const el = ev.target, s = current();
  if (el.dataset.efield && s){ const f = el.dataset.efield; sessions[s.id].exercices[+el.dataset.i][f] = f==="kcal" ? el.value.replace(/[^\d]/g,"") : el.dataset.unit==="m" ? (el.value.replace(/[^\d]/g,"") ? String(+el.value.replace(/[^\d]/g,"")/1000) : "") : el.value.replace(",",".").replace(/[^\d.]/g,""); save(s.id);
    const bs = document.querySelectorAll(".sess-head .meta b"); if (bs[2]) bs[2].textContent = kcal(sessions[s.id])+" kcal"; return; }
  if (el.dataset.note !== undefined && s){ sessions[s.id].exercices[+el.dataset.note].note = el.value; save(s.id); return; }
  if (el.id==="planName" && planEdit && sessions[planEdit]){ sessions[planEdit].nom = el.value; save(planEdit); const t = $("#planTitle"); if (t) t.textContent = sessName(sessions[planEdit]); return; }
  if (el.id==="newEx"){ $("#sugg").innerHTML = suggestions(el.value); return; }
  if (el.dataset.f && s){
    sessions[s.id].exercices[+el.dataset.i].series[+el.dataset.j][el.dataset.f] = el.value.replace(",",".").replace(/[^\d.]/g,"");
    save(s.id);
    const meta = document.querySelector(".sess-head .meta");
    if (meta) meta.querySelectorAll("b")[0].textContent = nbSeries(sessions[s.id]), meta.querySelectorAll("b")[1].textContent = fmtKg(volume(sessions[s.id]))+" kg"; const bs = meta && meta.querySelectorAll("b"); if (bs && bs[2]) bs[2].textContent = kcal(sessions[s.id])+" kcal";
  }
});
let justFocused = null;
document.addEventListener("focusin", ev => {
  const el = ev.target; if (!el.matches?.(".sets input, .ex-kcal input")) return;
  justFocused = el;
  const sel = () => { try { el.setSelectionRange(0, el.value.length); } catch { el.select(); } };

});
document.addEventListener("mouseup", ev => { if (ev.target === justFocused) { ev.preventDefault(); justFocused = null; } });
document.addEventListener("change", ev => {

document.addEventListener("submit", ev => { ev.preventDefault(); if (ev.target.dataset.form==="addex") addAny($("#newEx").value); });
window.addEventListener("hashchange", () => { confirmDel=null; render(); window.scrollTo(0,0); });

let chrono = null, chronoTick = null, wakeLock = null;
async function keepAwake(on){
  try{ if (window.Android && Android.keepScreenOn) Android.keepScreenOn(!!on); }catch{}
  try{
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  }catch{ wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && chrono) keepAwake(true); });
function startChrono(i,j){
  const s = current(); if (!s) return;
  stopTimer();
  chrono = {sid:s.id, i, j, start:Date.now()};
  $("#chronoLbl").textContent = "Série " + (j+1);
  keepAwake(true);
  $("#chrono").hidden = false; clearInterval(chronoTick); chronoTick = setInterval(drawChrono, 250); drawChrono(); render();
}
function drawChrono(){ if (!chrono) return; const sec = Math.floor((Date.now()-chrono.start)/1000); $("#chronoVal").textContent = Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0"); }
function endChrono(keep){
  clearInterval(chronoTick); $("#chrono").hidden = true; keepAwake(false);
  const c = chrono; chrono = null; if (!c) return;
  const ss = sessions[c.sid], e = ss && ss.exercices[c.i], x = e && e.series[c.j];
  if (keep && x){
    const sec = Math.max(1, Math.round((Date.now()-c.start)/1000));
    if (isCardio(e.nom)) x.reps = String(Math.max(1, Math.round(sec/60)));
    else { x.kg = String(sec); if (!x.reps) x.reps = "1"; }
    x.fait = true; save(c.sid, true);
  }
  render();
  if (keep && x && !isCardio(e.nom)) startTimer(REST);
}
$("#chronoStop").onclick = () => endChrono(true);
$("#chronoCancel").onclick = () => endChrono(false);

let timerEnd = 0, timerTick = null, buzzed = false;
function startTimer(sec){ buzzed = false; timerEnd = Date.now()+sec*1000; $("#timer").hidden=false; clearInterval(timerTick); timerTick=setInterval(drawTimer,250); drawTimer(); }
function stopTimer(){ clearInterval(timerTick); $("#timer").hidden=true; }
function drawTimer(){
  const left = Math.round((timerEnd-Date.now())/1000), a = Math.abs(left);
  $("#timerVal").textContent = (left<0?"+":"") + Math.floor(a/60) + ":" + String(a%60).padStart(2,"0");
  $("#timer").classList.toggle("over", left<0);
  if (left<=0 && !buzzed){ buzzed = true; try{ window.Android && Android.vibrate(500); }catch{} }
  if (left < -300) stopTimer();
}
$("#timerPlus").onclick = () => { timerEnd = Math.max(timerEnd, Date.now()) + 30000; drawTimer(); };
$("#timerStop").onclick = stopTimer;

/* ---------- couleurs et thème (mémorisés sur l'appareil) ---------- */
const COULEURS = {
  "Bleu":["#1f4fd1","#e2e9fb","#7d9dff","#1f2b45"], "Vert":["#15803d","#dcf2e3","#5fd08a","#173523"],
  "Orange":["#c2410c","#fde8dc","#fb923c","#3a2416"], "Rouge":["#b91c1c","#fde2e2","#f87171","#3b1d1d"],
  "Violet":["#6d28d9","#ece5fb","#a78bfa","#2a2045"], "Rose":["#be185d","#fbe3ee","#f472b6","#3b1d2c"],
  "Turquoise":["#0e7490","#dcf1f5","#22d3ee","#13313a"], "Graphite":["#334155","#e5e9ef","#cbd5e1","#263040"]
};
const THEMES = [["auto","Auto"],["light","Clair"],["dark","Sombre"]];
let prefs = { couleur:"Bleu", theme:"auto" };
try{ Object.assign(prefs, JSON.parse(localStorage.getItem("carnet-prefs")||"{}")); }catch{}
function applyPrefs(){
  const c = COULEURS[prefs.couleur] || COULEURS.Bleu;
  let st = document.getElementById("prefStyle");
  if (!st){ st = document.createElement("style"); st.id = "prefStyle"; document.body.appendChild(st); }
  const dark = `--accent:${c[2]};--accent-soft:${c[3]};--accent-ink:#0d1420`;
  st.textContent = `:root{--accent:${c[0]};--accent-soft:${c[1]};--accent-ink:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark}}}
:root[data-theme="dark"]{${dark}}`;
  if (prefs.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", prefs.theme);
  $("#swatches").innerHTML = Object.entries(COULEURS).map(([n,v])=>`<button class="sw" style="background:${v[0]}" data-couleur="${n}" aria-pressed="${n===prefs.couleur}" aria-label="${n}" title="${n}"></button>`).join("");
  $("#themes").innerHTML = THEMES.map(([k,l])=>`<button data-theme-pick="${k}" aria-pressed="${k===prefs.theme}">${l}</button>`).join("");
}
function savePrefs(){ try{ localStorage.setItem("carnet-prefs", JSON.stringify(prefs)); }catch{} applyPrefs(); }
$("#prefsBtn").onclick = () => { const p = $("#prefs"); p.hidden = !p.hidden; $("#prefsBtn").setAttribute("aria-expanded", String(!p.hidden)); };
$("#prefs").addEventListener("click", ev => {
  const c = ev.target.closest("[data-couleur]"), t = ev.target.closest("[data-theme-pick]");
  if (c){ prefs.couleur = c.dataset.couleur; savePrefs(); }
  if (t){ prefs.theme = t.dataset.themePick; savePrefs(); }
});
applyPrefs();

render();
initStore();
</script>
